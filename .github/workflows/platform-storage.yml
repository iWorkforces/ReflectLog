name: platform-storage

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

jobs:
  storage:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Frozen install
        run: uv sync --frozen
      - name: Focused gates
        run: uv run --frozen --no-sync scripts/run_platform_gates.py --focused --output platform-gates.json
      - name: Coordinator and engine tests
        run: uv run --frozen --no-sync pytest -q tests/unit/infrastructure/test_storage_coordinator.py tests/unit/infrastructure/test_usearch_engine.py tests/unit/infrastructure/test_tantivy_engine.py tests/unit/test_server.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-gates-${{ matrix.os }}
          path: platform-gates.json
