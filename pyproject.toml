[project]
name = "reflectlog"
version = "0.2.0"
description = "A MCP Server For AI Agent Project-base Memories"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "CCWorkforce Engineers" }
]
requires-python = ">=3.14.2"
keywords = ["mcp", "claude-code", "semantic-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "fastmcp>=3.0.2",
    "pydantic>=2.12.5",
    "fastapi[standard]>=0.133.1",
    "uvicorn[standard]>=0.41.0",
    "asyncer>=0.0.17",
    "anyio>=4.12.1",
    "python-dotenv>=1.2.1",
    "dynaconf>=3.2.12",
    "mcp>=1.26.0",
    "standard>=1.0.3",
    "uvloop>=0.22.1",
    "httptools>=0.7.1",
    "starlette>=0.52.1",
    "openai>=2.24.0",
    "tiktoken>=0.12.0",
    "aiohttp>=3.13.3",
    "aiodns>=4.0.0",
    "httpx-aiohttp>=0.1.12",
    "tantivy>=0.25.1",
    "usearch>=2.23.0",
    "numba>=0.64.0",
    "ranx>=0.3.21",
    "httpx[http2]>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.22",
    "itsdangerous>=2.2.0",
    "pyyaml>=6.0.3",
    "llvmlite==0.46.0",
    "h2>=4.3.0",
    "hpack>=4.1.0",
    "sentence-transformers>=5.2.3",
    "flagembedding>=1.3.5",
    "transformers<=5.2.0",
    "claude-agent-sdk>=0.1.44",
    "pydantic-core>=2.41.5",
]

[project.urls]
Homepage = "https://github.com/CCWorkforce/ReflectLogMCP"
Repository = "https://github.com/CCWorkforce/ReflectLogMCP"
Issues = "https://github.com/CCWorkforce/ReflectLogMCP/issues"
Documentation = "https://github.com/CCWorkforce/ReflectLogMCP#readme"

[project.scripts]
reflectlog = "reflectlog.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reflectlog"]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ty>=0.0.18",
    "pyright>=1.1.408",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # Ignore numba type safety warnings from ranx library (internal ranx issue)
    "ignore::numba.core.errors.NumbaTypeSafetyWarning",
]

[tool.coverage.run]
source = ["reflectlog"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ty.environment]
# Target Python version
python-version = "3.14"
# Custom stub paths (equivalent to mypy_path)
extra-paths = ["stubs"]

[tool.ty.src]
# Include project source and tests
include = ["reflectlog", "tests"]
# Exclude common non-source directories
exclude = [
    "indexes/",
    ".venv/",
    "__pycache__/",
]

[tool.ty.rules]
# Strict type checking rules (equivalent to mypy strict mode)
# Core type errors
unresolved-reference = "error"
invalid-type-form = "error"
call-non-callable = "error"

# Import resolution - warn for third-party libraries without stubs
unresolved-import = "error"

# Assignment and return type errors
invalid-assignment = "error"
invalid-return-type = "error"
invalid-argument-type = "error"

# Redundancy warnings
redundant-cast = "error"

# Module-specific rules for third-party libraries without stubs
possibly-missing-import = "error"

[tool.ty.terminal]
output-format = "full"
error-on-warning = true

[tool.pyright]
include = ["reflectlog"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/venv",
    "**/tests",
    "**/node_modules",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/build",
    "**/dist"
]
ignore = [
    "**/__pycache__",
    "**/.venv",
    "**/venv"
]
stubPath = "stubs"
typeCheckingMode = "standard"
pythonVersion = "3.14"
pythonPlatform = "Darwin"
reportMissingImports = "error"
reportMissingModuleSource = "error"
reportMissingTypeStubs = "warning"
reportUndefinedVariable = "error"
reportInvalidTypeArguments = "error"
reportGeneralTypeIssues = "error"
reportMissingSuperCall = "none"
reportOptionalMemberAccess = "warning"
reportOptionalCall = "warning"
reportOptionalIterable = "warning"
reportOptionalContextManager = "warning"
reportOptionalOperand = "warning"
reportUnusedImport = "warning"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportDuplicateImport = "warning"
reportWildcardImportFromLibrary = "warning"
reportShadowedImports = "warning"
reportPrivateImportUsage = "warning"
reportPrivateUsage = "none"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryComparison = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryContains = "warning"
reportAssertAlwaysTrue = "warning"
reportSelfClsParameterName = "warning"
reportUntypedFunctionDecorator = "warning"
reportUntypedClassDecorator = "warning"
reportUntypedBaseClass = "warning"
reportUntypedNamedTuple = "warning"
reportUnknownArgumentType = "warning"
reportUnknownMemberType = "warning"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"
reportAny = "warning"
reportImportCycles = "none"

[tool.ruff]
# Target Python 3.14
target-version = "py314"

[tool.ruff.lint]
# Enable pyupgrade rules for Python 3.14+ syntax
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade - Python 3.14+ modernizations
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
    "Q",     # flake8-quotes - enforce double quotes
]
# Fixable rules (can be auto-fixed with --fix)
fixable = ["UP", "I", "N", "F", "E", "W", "Q"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "E501"]
"reflectlog/**/*" = ["E501"]
"stubs/**/*" = ["E501"]

[tool.ruff.lint.isort]
single-line-exclusions = ["typing", "collections.abc"]
known-first-party = ["reflectlog"]
force-sort-within-sections = true

[tool.ruff.lint.pep8-naming]
# Ignore tests for naming conventions
ignore-names = ["test_*", "*_test"]

[tool.ruff.lint.pyupgrade]
# Python 3.14+ modernizations
keep-runtime-typing = false

[tool.ruff.lint.flake8-quotes]
# Enforce double quotes (project convention)
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[tool.ruff.format]
# Use double quotes for strings (ruff formatter)
quote-style = "double"
